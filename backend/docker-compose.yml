version: '3.8'

services:
  # Main application
  main:
    build: .
    command: python main.py
    ports:
      - "8000:8000"
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/universal_scraper  # Fixed: changed 5433 to 5432
    depends_on:
      - redis
      - postgres
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Crawler Worker
  crawler:
    build: .
    command: dramatiq workers.crawler_worker -p 1 -t 2 -v
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis  # Added
      - REDIS_PORT=6379   # Added
      - REDIS_DB=0        # Added
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/universal_scraper  # Fixed: changed localhost to postgres and 5433 to 5432
    depends_on:
      - redis
      - postgres
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Processor Worker
  processor:
    build: .
    command: dramatiq workers.processor_worker -p 1 -t 2 -v
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis  # Added
      - REDIS_PORT=6379   # Added
      - REDIS_DB=0        # Added
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/universal_scraper  # Fixed: changed localhost to postgres and 5433 to 5432
    depends_on:
      - redis
      - postgres
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Chunker Worker
  chunker:
    build: .
    command: dramatiq workers.chunker_worker -p 1 -t 2 -v
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis  # Added
      - REDIS_PORT=6379   # Added
      - REDIS_DB=0        # Added
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/universal_scraper  # Fixed: changed localhost to postgres and 5433 to 5432
    depends_on:
      - redis
      - postgres
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Embedder Worker
  embedder:
    build: .
    command: dramatiq workers.embedder_worker -p 1 -t 2 -v
    volumes:
      - .:/app
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_HOST=redis  # Added
      - REDIS_PORT=6379   # Added
      - REDIS_DB=0        # Added
      - DATABASE_URL=postgresql://postgres:postgres@postgres:5432/universal_scraper  # Fixed: changed localhost to postgres and 5433 to 5432
    depends_on:
      - redis
      - postgres
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis (for Dramatiq broker)
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PostgreSQL
  postgres:
    # image: postgres:15-alpine
    image: pgvector/pgvector:pg18
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=universal_scraper
    ports:
      - "5433:5432"  # Host port 5433 maps to container port 5432
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - app-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data: